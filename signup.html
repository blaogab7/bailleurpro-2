<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Créer mon compte — BailleurPro</title>
  <meta name="description" content="Inscrivez-vous à BailleurPro pour gérer vos loyers et sous-compteurs en toute sérénité.">
  <meta name="theme-color" content="#1E40AF">

  <!-- Police Google Fonts : Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CDN Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #1E40AF;
      --primary-vibrant: #2563EB;
      --bg-light: #EFF6FF;
      --text-main: #0F172A;
      --text-secondary: #475569;
      --border-color: #E2E8F0;
      --title-color: #0F256E;
      --card-bg: #FFFFFF;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --success: #059669;
      --success-bg: #ECFDF5;
      --radius-card: 18px;
      --radius-full: 9999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    /* Logo dans une pastille */
    .logo-header {
      display: flex;
      justify-content: center;
      margin-bottom: 1.75rem;
    }

    .logo-pastille {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: #FFFFFF;
      padding: 0.5rem 1.15rem 0.5rem 0.65rem;
      border-radius: var(--radius-full);
      box-shadow: 0 4px 14px rgba(30, 64, 175, 0.08);
      border: 1px solid #DBEAFE;
      text-decoration: none;
      transition: transform 0.2s ease;
      min-height: 44px;
    }

    .logo-pastille:hover {
      transform: translateY(-1px);
    }

    .logo-badge-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-vibrant) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 1.125rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--primary-vibrant);
    }

    /* Carte blanche */
    .auth-card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(30, 64, 175, 0.07), 0 8px 10px -6px rgba(30, 64, 175, 0.04);
      padding: 2.25rem 2rem;
    }

    .auth-title {
      color: var(--title-color);
      font-size: 1.625rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    /* Formulaire */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      min-height: 46px;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: #FFFFFF;
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-vibrant);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-input::placeholder {
      color: #94A3B8;
    }

    /* Bouton en pilule avec dégradé bleu */
    .btn-submit {
      width: 100%;
      min-height: 46px;
      padding: 0.75rem 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: #FFFFFF;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-vibrant) 100%);
      border: none;
      border-radius: var(--radius-full);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.28);
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(30, 64, 175, 0.35);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Messages d'alerte */
    .alert-box {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .alert-box.error {
      display: block;
      background-color: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #FECACA;
    }

    .alert-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success);
      border: 1px solid #A7F3D0;
    }

    /* Lien bas de page */
    .auth-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.9375rem;
      color: var(--text-secondary);
    }

    .auth-link {
      color: var(--primary-vibrant);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.15s ease;
      padding: 0.25rem;
    }

    .auth-link:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.25rem;
      }
      .auth-title {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Logo BailleurPro -->
    <div class="logo-header">
      <a href="index.html" class="logo-pastille" aria-label="BailleurPro - Retour à l'accueil">
        <div class="logo-badge-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"></path>
            <path d="M5 21V7l7-4 7 4v14"></path>
            <path d="M9 10h1"></path>
            <path d="M9 14h1"></path>
            <path d="M14 10h1"></path>
            <path d="M14 14h1"></path>
            <path d="M11 21v-3a1 1 0 0 1 1-1h0a1 1 0 0 1 1 1v3"></path>
          </svg>
        </div>
        <div class="logo-text">Bailleur<span>Pro</span></div>
      </a>
    </div>

    <!-- Carte d'inscription -->
    <div class="auth-card">
      <h1 class="auth-title">Créer mon compte</h1>
      <p class="auth-subtitle">Essai gratuit de 30 jours, sans carte bancaire.</p>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="nom">Nom complet</label>
          <input type="text" id="nom" class="form-input" placeholder="Ex. Patrice Kouamé" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Adresse e-mail</label>
          <input type="email" id="email" class="form-input" placeholder="votre.email@exemple.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input type="password" id="password" class="form-input" placeholder="8 caractères minimum" minlength="8" required autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          Créer mon compte
        </button>

        <div id="alertBox" class="alert-box" role="alert"></div>
      </form>
    </div>

    <!-- Lien vers la connexion -->
    <div class="auth-footer">
      Déjà inscrit ? <a href="login.html" class="auth-link">Se connecter</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://TON-PROJET.supabase.co';
    const SUPABASE_ANON_KEY = 'TA_CLE_ANON_PUBLIC';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const signupForm = document.getElementById('signupForm');
    const nomInput = document.getElementById('nom');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert-box ' + type;
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.className = 'alert-box';
    }

    signupForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearAlert();

      const nom = nomInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!nom) {
        showAlert('Veuillez renseigner votre nom complet.', 'error');
        nomInput.focus();
        return;
      }

      if (!email) {
        showAlert('Veuillez renseigner votre adresse e-mail.', 'error');
        emailInput.focus();
        return;
      }

      if (!password || password.length < 8) {
        showAlert('Le mot de passe doit comporter au moins 8 caractères.', 'error');
        passwordInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Création du compte...';

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { nom: nom }
          }
        });

        if (error) {
          showAlert(error.message || "Une erreur est survenue lors de l'inscription.", 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Créer mon compte';
        } else {
          showAlert('Compte créé. Redirection...', 'success');
          setTimeout(function () {
            window.location.href = 'dashboard.html';
          }, 800);
        }
      } catch (err) {
        showAlert("Une erreur inattendue est survenue. Veuillez réessayer.", 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Créer mon compte';
      }
    });
  </script>
</body>
</html>
